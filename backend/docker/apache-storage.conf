# Files in storage are data. Nothing there may ever run, whatever it is called.
# Apache does not resolve symlinks in <Directory>, so the public/storage link is listed too.
<Directory /var/www/html/public/storage>
    php_admin_flag engine off
    Options -ExecCGI -Indexes
    <FilesMatch "(?i)\.(php[0-9]*|pht|phtml|phar)(\.|$)">
        Require all denied
    </FilesMatch>
</Directory>

<Directory /var/www/html/storage/app/public>
    php_admin_flag engine off
    Options -ExecCGI -Indexes
    <FilesMatch "(?i)\.(php[0-9]*|pht|phtml|phar)(\.|$)">
        Require all denied
    </FilesMatch>
</Directory>
