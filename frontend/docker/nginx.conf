# The page may only load its own files, plus blob: images for the admin's upload preview. Uploads
# under /storage get no permissions at all.
map $uri $content_security_policy {
    ~^/storage/ "default-src 'none'; frame-ancestors 'none'; sandbox";
    default "default-src 'self'; img-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'";
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 20m;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    # woff2 and images are already compressed. text/html is always included.
    gzip_types text/css text/plain text/javascript application/javascript application/json image/svg+xml;

    # add_header in a location drops the headers of the server block, so every location that
    # sets its own header includes this file instead.
    include /etc/nginx/snippets/security-headers.conf;

    # Laravel API
    location /api/ {
        proxy_pass http://backend:80;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        # This nginx is the edge, so a client's own X-Forwarded-For must not reach Laravel.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Uploads are data: nothing under /storage may run as code, here or in the backend. The match
    # covers a script name anywhere in the path, so /storage/a.php/b.jpg is refused as well.
    location ~* ^/storage/.*\.(php[0-9]?|phtml|phar|pht|cgi|pl|py|sh|html?|svgz?|xml|js)(/|$) {
        return 403;
    }

    # Product images served by Laravel (public/storage symlink)
    location /storage/ {
        proxy_pass http://backend:80;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_hide_header Cache-Control;
        proxy_hide_header Expires;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=2592000";
    }

    # Hashed build assets never change under the same name
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # The home page. The hero is its LCP image, and this header announces it with the HTML, before
    # any script runs and on this route only, which static HTML and a strict CSP cannot do.
    location = / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        add_header Link "</storage/header-banner.jpg>; rel=preload; as=image; fetchpriority=high" always;
        try_files /index.html =404;
    }

    # React Router (SPA) fallback. The page must be revalidated so a release reaches browsers.
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}
