# The page may only load its own files. Uploads under /storage get no permissions at all.
map $uri $content_security_policy {
    ~^/storage/ "default-src 'none'; frame-ancestors 'none'; sandbox";
    default "default-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'";
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 20m;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    # woff2 and images are already compressed. text/html is always included.
    gzip_types text/css text/plain text/javascript application/javascript application/json image/svg+xml;

    # add_header in a location drops the headers of the server block, so every location that
    # sets its own header includes this file instead.
    include /etc/nginx/snippets/security-headers.conf;

    # Laravel API
    location /api/ {
        proxy_pass http://backend:80;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Uploads are data: nothing under /storage may run as code, here or in the backend.
    location ~* ^/storage/.*\.(php[0-9]?|phtml|phar|pht|cgi|pl|py|sh|html?|svgz?|xml|js)$ {
        return 403;
    }

    # Product images served by Laravel (public/storage symlink)
    location /storage/ {
        proxy_pass http://backend:80;
        proxy_set_header Host $http_host;
        proxy_hide_header Cache-Control;
        proxy_hide_header Expires;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=604800" always;
    }

    # Hashed build assets never change under the same name
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # React Router (SPA) fallback. The page must be revalidated so a release reaches browsers.
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}
