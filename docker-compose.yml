name: online-store

# Ports and secrets come from the root .env file (generated by setup.ps1 / setup.sh).
# The defaults below let `docker compose up` work even without running the setup script.

x-backend-environment: &backend-environment
  APP_NAME: "Online Store"
  APP_ENV: local
  APP_DEBUG: "${APP_DEBUG:-false}"
  APP_KEY: ${APP_KEY:-}
  APP_URL: http://localhost:${APP_PORT:-8080}
  LOG_CHANNEL: stderr
  DB_CONNECTION: mysql
  DB_HOST: db
  DB_PORT: 3306
  DB_DATABASE: ${DB_DATABASE:-shop}
  DB_USERNAME: ${DB_USERNAME:-shop}
  DB_PASSWORD: ${DB_PASSWORD:-shop_secret}
  SESSION_DRIVER: database
  CACHE_STORE: database
  QUEUE_CONNECTION: database
  FILESYSTEM_DISK: local
  MAIL_MAILER: smtp
  MAIL_HOST: mailpit
  MAIL_PORT: 1025
  MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-sklep@example.com}
  MAIL_FROM_NAME: "Online Store"
  ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
  ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
  SHOP_UNPAID_ORDER_HOURS: ${SHOP_UNPAID_ORDER_HOURS:-48}
  SHOP_CONTACT_EMAIL: "${SHOP_CONTACT_EMAIL:-kontakt@sklep.example}"
  SHOP_CONTACT_PHONE: "${SHOP_CONTACT_PHONE:-+48 000 000 000}"
  SHOP_CONTACT_ADDRESS: "${SHOP_CONTACT_ADDRESS:-ul. Przykładowa 1, 00-001 Warszawa}"
  SHOP_CONTACT_HOURS: "${SHOP_CONTACT_HOURS:-pon.-pt. 9:00-17:00}"
  SANCTUM_STATEFUL_DOMAINS: localhost:${APP_PORT:-8080},127.0.0.1:${APP_PORT:-8080}
  CORS_ALLOWED_ORIGINS: http://localhost:${APP_PORT:-8080},http://127.0.0.1:${APP_PORT:-8080}
  # Only nginx may set the client IP: per-IP rate limits depend on it.
  TRUSTED_PROXIES: ${FRONTEND_IP:-10.213.47.10}

services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-shop}
      MYSQL_USER: ${DB_USERNAME:-shop}
      MYSQL_PASSWORD: ${DB_PASSWORD:-shop_secret}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_secret}
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    ports:
      - "127.0.0.1:${DB_FORWARD_PORT:-3306}:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  backend:
    build:
      context: ./backend
    image: online-store-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started
    environment: *backend-environment
    volumes:
      # Uploaded photos and thumbnails have to outlive a rebuilt image.
      - product_images:/var/www/html/storage/app/public
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:80"
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://localhost/up') === false ? 1 : 0);"]
      interval: 5s
      timeout: 5s
      retries: 30
      # The first start also resizes every product photo.
      start_period: 120s

  queue:
    image: online-store-backend
    pull_policy: never
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      <<: *backend-environment
      RUN_MIGRATIONS: "false"
    volumes:
      - product_images:/var/www/html/storage/app/public
    # The limits make the worker exit and restart, so a slow leak cannot build up.
    command: ["php", "artisan", "queue:work", "--tries=3", "--max-jobs=500", "--max-time=3600", "--memory=256"]

  scheduler:
    image: online-store-backend
    pull_policy: never
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      <<: *backend-environment
      RUN_MIGRATIONS: "false"
    volumes:
      - product_images:/var/www/html/storage/app/public
    # Runs what routes/console.php schedules: expiring unpaid orders, pruning the newsletter.
    command: ["php", "artisan", "schedule:work"]

  mailpit:
    image: axllent/mailpit
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MAILPIT_PORT:-8025}:8025"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: /
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${APP_PORT:-8080}:80"
    networks:
      default:
        ipv4_address: ${FRONTEND_IP:-10.213.47.10}

networks:
  default:
    ipam:
      config:
        - subnet: ${DOCKER_SUBNET:-10.213.47.0/24}

volumes:
  db_data:
  product_images:
